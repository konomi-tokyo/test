<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文概要</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        Arial,
        sans-serif;
      color: #555;
      background: #fff;
    }

    body {
      min-height: 721px;
    }

    .checkout {
      display: flex;
      width: 100%;
      min-height: 721px;
      background: #fff;
    }

    /* =========================
       Left: Order summary
       ========================= */

    .order-summary {
      width: 50.2%;
      min-height: 721px;
      padding: 23px 30px 40px 12px;
      background: #fafafa;
    }

    .summary-inner {
      width: 100%;
      max-width: 526px;
    }

    .summary-title {
      margin: 0 0 43px;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      color: #555;
      letter-spacing: -0.5px;
    }

    .current-price {
      display: flex;
      align-items: baseline;
      margin-bottom: 51px;
      color: #0789c7;
    }

    .current-price .price {
      font-size: 43px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .current-price .tax-label {
      margin-left: 9px;
      font-size: 22px;
      line-height: 1;
      color: #555;
      font-weight: 400;
    }

    .product {
      display: flex;
      align-items: center;
      min-height: 76px;
      margin-bottom: 30px;
    }

    .abp-icon {
      position: relative;
      flex: 0 0 82px;
      width: 82px;
      height: 82px;
      margin-right: 31px;
      background: #ed1b3b;
      clip-path: polygon(
        27% 0,
        73% 0,
        100% 27%,
        100% 73%,
        73% 100%,
        27% 100%,
        0 73%,
        0 27%
      );
      border: 0;
    }

    .abp-icon::before {
      content: "";
      position: absolute;
      inset: 4px;
      background: #fff;
      clip-path: polygon(
        27% 0,
        73% 0,
        100% 27%,
        100% 73%,
        73% 100%,
        27% 100%,
        0 73%,
        0 27%
      );
      z-index: 0;
    }

    .abp-icon::after {
      content: "ABP";
      position: absolute;
      inset: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ed1b3b;
      color: #fff;
      font-size: 29px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      clip-path: polygon(
        27% 0,
        73% 0,
        100% 27%,
        100% 73%,
        73% 100%,
        27% 100%,
        0 73%,
        0 27%
      );
      z-index: 1;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      margin: 0 0 20px;
      color: #111;
      font-size: 22px;
      line-height: 1;
      font-weight: 400;
      white-space: nowrap;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 18px;
      line-height: 1;
      color: #555;
    }

    .quantity {
      white-space: nowrap;
    }

    .start-date {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
    }

    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: 2px solid #777;
      border-radius: 50%;
      color: #777;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-divider {
      width: calc(100% - 1px);
      height: 1px;
      margin: 0 0 14px 113px;
      background: #e2e2e2;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding-left: 113px;
      padding-right: 0;
      font-size: 22px;
      line-height: 1;
    }

    .summary-row .label {
      color: #666;
    }

    .summary-row .value {
      color: #111;
      font-weight: 700;
      white-space: nowrap;
    }

    .discount {
      display: block;
      margin: 16px 0 13px 113px;
      color: #0789c7;
      font-size: 22px;
      line-height: 1;
      text-decoration: none;
    }

    .tax-row {
      margin-top: 3px;
    }

    .due-today {
      margin-top: 4px;
    }

    .bottom-divider {
      width: calc(100% - 113px);
      height: 1px;
      margin: 4px 0 8px 113px;
      background: #e2e2e2;
    }

    /* =========================
       Right: Customer/payment
       ========================= */

    .payment-panel {
      position: relative;
      width: 49.8%;
      min-height: 721px;
      padding: 24px 9px 14px 28px;
      background: #fff;
    }

    .payment-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 680px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      margin-bottom: 42px;
      font-size: 24px;
      line-height: 1;
      white-space: nowrap;
    }

    .panel-header .active {
      color: #0789c7;
      font-weight: 700;
    }

    .panel-header .arrow {
      margin: 0 12px;
      color: #777;
      font-size: 26px;
      font-weight: 300;
    }

    .panel-header .inactive {
      color: #777;
      font-weight: 400;
    }

    .close-button {
      position: absolute;
      top: -1px;
      right: 1px;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 31px;
      line-height: 20px;
      font-weight: 300;
      cursor: pointer;
    }

    .security-message {
      width: 100%;
      max-width: 510px;
      margin-bottom: 30px;
      color: #666;
      font-size: 22px;
      line-height: 1.5;
      letter-spacing: -0.3px;
    }

    .field {
      width: 100%;
      max-width: 528px;
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      margin-bottom: 11px;
      color: #555;
      font-size: 20px;
      line-height: 1;
      font-weight: 400;
    }

    .required {
      margin-left: 2px;
      color: #e21e35;
      font-size: 16px;
      vertical-align: top;
    }

    .input,
    .select {
      width: 100%;
      height: 60px;
      border: 1px solid #d5d5d5;
      border-radius: 6px;
      background: #fff;
      color: #444;
      font-family: inherit;
      font-size: 20px;
      outline: none;
    }

    .input {
      padding: 0 17px;
    }

    .input:focus,
    .select:focus {
      border-color: #0789c7;
      box-shadow: 0 0 0 1px #0789c7;
    }

    .select-wrapper {
      position: relative;
    }

    .select {
      appearance: none;
      -webkit-appearance: none;
      padding: 0 48px 0 20px;
      cursor: pointer;
    }

    .select-arrow {
      position: absolute;
      top: 50%;
      right: 24px;
      width: 11px;
      height: 11px;
      border-right: 1.5px solid #999;
      border-bottom: 1.5px solid #999;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .next-button {
      position: absolute;
      left: 1px;
      right: 0;
      bottom: 0;
      width: calc(100% - 1px);
      height: 60px;
      border: 0;
      border-radius: 6px;
      background: #078dcc;
      color: #fff;
      font-family: inherit;
      font-size: 25px;
      line-height: 60px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .next-button:hover {
      background: #087fb6;
    }

    .next-button:active {
      transform: translateY(1px);
    }

    /* =========================
       Responsive
       ========================= */

    @media (max-width: 800px) {
      body {
        min-height: 100vh;
      }

      .checkout {
        flex-direction: column;
      }

      .order-summary,
      .payment-panel {
        width: 100%;
        min-height: auto;
      }

      .order-summary {
        padding: 25px 24px 35px;
      }

      .payment-panel {
        min-height: 620px;
        padding: 25px 24px 25px;
      }

      .summary-divider {
        margin-left: 0;
        width: 100%;
      }

      .summary-row {
        padding-left: 0;
      }

      .discount {
        margin-left: 0;
      }

      .bottom-divider {
        margin-left: 0;
        width: 100%;
      }

      .next-button {
        left: 0;
        width: 100%;
      }

      .product-meta {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 500px) {
      .current-price .price {
        font-size: 36px;
      }

      .current-price .tax-label {
        font-size: 18px;
      }

      .product {
        align-items: flex-start;
      }

      .abp-icon {
        flex-basis: 65px;
        width: 65px;
        height: 65px;
        margin-right: 18px;
      }

      .abp-icon::before {
        inset: 3px;
      }

      .abp-icon::after {
        inset: 5px;
        font-size: 22px;
      }

      .product-name {
        font-size: 18px;
      }

      .product-meta {
        font-size: 15px;
      }

      .summary-row,
      .discount {
        font-size: 18px;
      }

      .panel-header {
        font-size: 20px;
      }

      .security-message {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="checkout">

    <section class="order-summary" aria-label="注文概要">
      <div class="summary-inner">
        <h1 class="summary-title">ご注文の概要</h1>

        <div class="current-price">
          <span class="price">現在 ¥660</span>
          <span class="tax-label">消費税込み</span>
        </div>

        <div class="product">
          <div class="abp-icon" aria-label="Adblock Plus"></div>

          <div class="product-info">
            <p class="product-name">Tokyo AdBlocker Premium</p>

            <div class="product-meta">
              <span class="quantity">数量：1</span>

              <span class="start-date">
                <span>2026年9月28日から</span>
                <span class="info-icon">i</span>
              </span>
            </div>
          </div>
        </div>

        <div class="summary-divider"></div>

        <div class="summary-row">
          <span class="label">小計</span>
          <span class="value">¥600</span>
        </div>

        <a class="discount" href="#">割引を追加</a>

        <div class="summary-row tax-row">
          <span class="label">消費税</span>
          <span class="value">¥60</span>
        </div>

        <div class="summary-row due-today">
          <span class="label">今日が期日</span>
          <span class="value">¥660</span>
        </div>

        <div class="bottom-divider"></div>

        <div class="summary-row">
          <span class="label">期限 2027年9月28日</span>
          <span class="value">¥660</span>
        </div>
      </div>
    </section>

    <section class="payment-panel" aria-label="お客様の詳細">
      <div class="payment-inner">

        <button class="close-button" type="button" aria-label="閉じる">
          ×
        </button>

        <header class="panel-header">
          <span class="active">お客様の詳細</span>
          <span class="arrow">›</span>
          <span class="inactive">お支払い</span>
        </header>

        <p class="security-message">
          不正利用防止のため、およびあなたの支払いを安全<br>
          に保つために収集されます。
        </p>

        <div class="field">
          <label class="field-label" for="email">
            電子メールアドレス<span class="required">*</span>
          </label>

          <input
            id="email"
            class="input"
            type="email"
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label class="field-label" for="country">
            国<span class="required">*</span>
          </label>

          <div class="select-wrapper">
            <select id="country" class="select">
              <option selected>日本</option>
              <option>アメリカ合衆国</option>
              <option>イギリス</option>
              <option>韓国</option>
              <option>中国(台湾を除く)</option>
              <option>台湾</option>
              <option>インド</option>
              <option>ブラジル</option>
              <option>インドネシア</option>
            </select>
            <span class="select-arrow"></span>
          </div>
        </div>

        <button class="next-button" type="button">
          次へ進む
        </button>

      </div>
    </section>

  </main>
</body>
</html>

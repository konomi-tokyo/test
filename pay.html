<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文概要</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        Arial,
        sans-serif;
      color: #555;
      background: #fff;
    }

    body {
      min-height: 721px;
    }

    .checkout {
      display: flex;
      width: 100%;
      min-height: 721px;
    }

    /* 左側 */

    .order-summary {
      width: 50.2%;
      min-height: 721px;
      padding: 23px 30px 40px 12px;
      background: #fafafa;
    }

    .summary-inner {
      width: 100%;
      max-width: 526px;
    }

    .summary-title {
      margin: 0 0 43px;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      color: #555;
    }

    .current-price {
      display: flex;
      align-items: baseline;
      margin-bottom: 51px;
      color: #0789c7;
    }

    .current-price .price {
      font-size: 43px;
      line-height: 1;
      font-weight: 700;
    }

    .current-price .tax-label {
      margin-left: 9px;
      font-size: 22px;
      color: #555;
    }

    .product {
      display: flex;
      align-items: center;
      min-height: 82px;
      margin-bottom: 30px;
    }

    /*
     * 実際の画像をそのまま表示する
     */
    .abp-icon {
      flex: 0 0 82px;
      width: 82px;
      height: 82px;
      margin-right: 31px;
      display: block;
      object-fit: contain;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      margin: 0 0 20px;
      color: #111;
      font-size: 22px;
      line-height: 1;
      font-weight: 400;
      white-space: nowrap;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 18px;
      line-height: 1;
    }

    .quantity {
      white-space: nowrap;
    }

    .start-date {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
    }

    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: 2px solid #777;
      border-radius: 50%;
      color: #777;
      font-size: 15px;
      font-weight: 700;
    }

    .summary-divider {
      width: calc(100% - 1px);
      height: 1px;
      margin: 0 0 14px 113px;
      background: #e2e2e2;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding-left: 113px;
      font-size: 22px;
    }

    .summary-row .label {
      color: #666;
    }

    .summary-row .value {
      color: #111;
      font-weight: 700;
    }

    .discount {
      display: block;
      margin: 16px 0 13px 113px;
      color: #0789c7;
      font-size: 22px;
      text-decoration: none;
    }

    .bottom-divider {
      width: calc(100% - 113px);
      height: 1px;
      margin: 4px 0 8px 113px;
      background: #e2e2e2;
    }

    /* 右側 */

    .payment-panel {
      position: relative;
      width: 49.8%;
      min-height: 721px;
      padding: 24px 9px 14px 28px;
      background: #fff;
    }

    .payment-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 680px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      margin-bottom: 42px;
      font-size: 24px;
      white-space: nowrap;
    }

    .panel-header .active {
      color: #0789c7;
      font-weight: 700;
    }

    .panel-header .arrow {
      margin: 0 12px;
      color: #777;
      font-size: 26px;
    }

    .panel-header .inactive {
      color: #777;
    }

    .close-button {
      position: absolute;
      top: -1px;
      right: 1px;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 31px;
      cursor: pointer;
    }

    .security-message {
      width: 100%;
      max-width: 510px;
      margin-bottom: 30px;
      color: #666;
      font-size: 22px;
      line-height: 1.5;
    }

    .field {
      width: 100%;
      max-width: 528px;
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      margin-bottom: 11px;
      color: #555;
      font-size: 20px;
    }

    .required {
      margin-left: 2px;
      color: #e21e35;
      font-size: 16px;
      vertical-align: top;
    }

    .input,
    .select {
      width: 100%;
      height: 60px;
      border: 1px solid #d5d5d5;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 20px;
      outline: none;
    }

    .input {
      padding: 0 17px;
    }

    .select-wrapper {
      position: relative;
    }

    .select {
      appearance: none;
      padding: 0 48px 0 20px;
      color: #444;
      cursor: pointer;
    }

    .select-arrow {
      position: absolute;
      top: 50%;
      right: 24px;
      width: 11px;
      height: 11px;
      border-right: 1.5px solid #999;
      border-bottom: 1.5px solid #999;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .next-button {
      position: absolute;
      left: 1px;
      right: 0;
      bottom: 0;
      width: calc(100% - 1px);
      height: 60px;
      border: 0;
      border-radius: 6px;
      background: #078dcc;
      color: #fff;
      font-family: inherit;
      font-size: 25px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .checkout {
        flex-direction: column;
      }

      .order-summary,
      .payment-panel {
        width: 100%;
        min-height: auto;
      }

      .order-summary {
        padding: 25px 24px 35px;
      }

      .payment-panel {
        min-height: 620px;
        padding: 25px 24px;
      }

      .summary-divider {
        margin-left: 0;
        width: 100%;
      }

      .summary-row {
        padding-left: 0;
      }

      .discount {
        margin-left: 0;
      }

      .bottom-divider {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="checkout">

    <section class="order-summary">
      <div class="summary-inner">

        <h1 class="summary-title">
          ご注文の概要
        </h1>

        <div class="current-price">
          <span class="price">現在 ¥660</span>
          <span class="tax-label">消費税込み</span>
        </div>

        <div class="product">

          <!-- 画像を挿入 -->
          <img
            class="abp-icon"
            src="/tab.png"
            alt="Adblock Plus"
          >

          <div class="product-info">

            <p class="product-name">
              Adblock Plus Premium
            </p>

            <div class="product-meta">
              <span class="quantity">
                数量：1
              </span>

              <span class="start-date">
                <span>2026年9月28日から</span>
                <span class="info-icon">i</span>
              </span>
            </div>

          </div>
        </div>

        <div class="summary-divider"></div>

        <div class="summary-row">
          <span class="label">小計</span>
          <span class="value">¥600</span>
        </div>

        <a class="discount" href="#">
          割引を追加
        </a>

        <div class="summary-row">
          <span class="label">消費税</span>
          <span class="value">¥60</span>
        </div>

        <div class="summary-row">
          <span class="label">今日が期日</span>
          <span class="value">¥660</span>
        </div>

        <div class="bottom-divider"></div>

        <div class="summary-row">
          <span class="label">期限 2026年9月28日</span>
          <span class="value">¥660</span>
        </div>

      </div>
    </section>

    <section class="payment-panel">
      <div class="payment-inner">

        <button class="close-button" type="button">
          ×
        </button>

        <header class="panel-header">
          <span class="active">お客様の詳細</span>
          <span class="arrow">›</span>
          <span class="inactive">お支払い</span>
        </header>

        <p class="security-message">
          不正利用防止のため、およびあなたの支払いを安全<br>
          に保つために収集されます。
        </p>

        <div class="field">
          <label class="field-label" for="email">
            電子メールアドレス<span class="required">*</span>
          </label>

          <input
            id="email"
            class="input"
            type="email"
          >
        </div>

        <div class="field">
          <label class="field-label" for="country">
            国<span class="required">*</span>
          </label>

          <div class="select-wrapper">
            <select id="country" class="select">
              <option selected>日本</option>
              <option>韓国</option>
              <option>台湾</option>
              <option>中国</option>
              <option>アメリカ合衆国</option>
              <option>イギリス</option>
              <option>カナダ</option>
              <option>インド</option>
              <option>タイ</option>
              <option>フィリピン</option>
              <option>ブラジル</option>
            </select>

            <span class="select-arrow"></span>
          </div>
        </div>

        <button class="next-button" type="button">
          次へ進む
        </button>

      </div>
    </section>

  </main>
</body>
</html>
